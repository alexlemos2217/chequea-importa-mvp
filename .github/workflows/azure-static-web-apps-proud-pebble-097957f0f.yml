
name: Chequea Importa - Azure Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Obtener identidad de GitHub
        id: idtoken
        uses: actions/github-script@v7
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string

      - name: Publicar Chequea Importa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_PEBBLE_097957F0F }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ""
          skip_app_build: true
